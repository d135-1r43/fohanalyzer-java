name: Build

# The deliverable is a jpackage bundle, which can only be built on the target OS, so
# everything runs on a macOS runner. macos-latest is arm64 — the .dmg it produces is
# arm64-only; an Intel or universal build would need a second runner.

on:
  push:
    branches: [master]
    # Both the maven-release-plugin default tag format (artifactId-version) and the
    # v-prefixed one, so either release configuration triggers a release build.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'fohanalyzer-java-[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      # Only the release step needs this; on branch and PR builds it goes unused.
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # The release notes are built from `git log` between tags, which needs the history
          # and the tags — the default shallow, tagless checkout cannot see either.
          fetch-depth: 0

      # Also what the project targets: release 25, the current LTS.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Read the version from the pom
        id: pom
        run: |
          version="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

      # A tag that disagrees with the pom would publish a release whose bundle carries a
      # different version, so fail before anything is built.
      - name: Check the tag against the pom version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          tag_version="${tag_version#fohanalyzer-java-}"
          pom_version='${{ steps.pom.outputs.version }}'
          if [ "$tag_version" != "$pom_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the pom version $pom_version"
            exit 1
          fi
          case "$pom_version" in
            *-SNAPSHOT)
              echo "::error::refusing to release a snapshot version ($pom_version)"
              exit 1
              ;;
          esac

      # package-mac.sh runs `mvn clean package` on the way, so the formatter gate and the
      # tests both run here before jpackage is reached.
      - name: Build
        run: ./scripts/package-mac.sh

      - uses: actions/upload-artifact@v7
        with:
          name: FOHanalyzer-${{ steps.pom.outputs.version }}
          path: target/dist/*.dmg
          if-no-files-found: error

      # Notes are the install preamble plus a changelog built from `git log`.
      #
      # Deliberately NOT --generate-notes: that calls GitHub's Release Notes API, which lists
      # merged pull requests. Work here lands as direct commits to master, so the only PRs in
      # the history are Dependabot's — 2.4.0 was first published listing four dependency
      # bumps and none of the actual features. Commits are the real record.
      #
      # Created as a draft so the changelog can be read before anyone can download it;
      # publish from the Releases page.
      - name: Build the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Previous tag reachable from this one, if any; empty for the first release.
          prev="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            range="$prev..$GITHUB_REF_NAME"
            echo "changelog range: $range"
          else
            range="$GITHUB_REF_NAME"
            echo "no previous tag — logging the whole history"
          fi

          # Oldest first, and drop the release plugin's own version commits: they say nothing
          # a reader wants and they would top every list. Can legitimately come out empty —
          # a release cut immediately after the previous one has only those commits.
          changes="$(git log --reverse --format='- %s' "$range" \
            | grep -v '^- \[maven-release-plugin\]' || true)"

          {
            cat .github/release-preamble.md
            echo
            echo "## Changes"
            echo
            if [ -n "$changes" ]; then
              echo "$changes"
            else
              echo "_No functional changes since the previous release._"
            fi
            echo
            if [ -n "$prev" ]; then
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            else
              echo "**Full history**: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
            fi
          } > target/release-notes.md

          echo "--- notes ---"
          cat target/release-notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "FOHanalyzer ${{ steps.pom.outputs.version }}" \
            --draft \
            --notes-file target/release-notes.md \
            target/dist/*.dmg
