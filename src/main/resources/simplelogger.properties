# slf4j-simple writes to stderr. This is a desktop app, not a service: nobody is
# tailing a log file, so the format is trimmed to what is useful when the app was
# started from a terminal — level, short class name, message. No timestamps, no
# thread names.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true
